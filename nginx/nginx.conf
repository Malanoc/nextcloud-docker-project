# Exécute les processus de travail Nginx avec l'utilisateur non privilégié nginx
user nginx;
# Adapte automatiquement le nombre de workers aux ressources CPU disponibles
worker_processes auto;

# Paramètres liés aux connexions réseau gérées par les workers
events {
    # Nombre maximal de connexions simultanées par processus worker
    worker_connections 1024;
}

# Paramètres communs aux requêtes HTTP
http {
    # Associe les extensions de fichiers aux types MIME (CSS, JS, images...)
    include /etc/nginx/mime.types;
    # Type générique si aucun type MIME n'est reconnu
    default_type application/octet-stream;

    # Optimise l'envoi de fichiers statiques via le noyau Linux
    sendfile on;

    # Définit une destination FastCGI nommée php-handler
    upstream php-handler {
        # "app" est le nom du service Compose ; PHP-FPM écoute sur le port 9000
        server app:9000;
    }

    # Configuration du site web Nextcloud
    server {
        # Nginx écoute en HTTP sur le port 80 du conteneur
        listen 80;

        # Répertoire contenant les fichiers Nextcloud du volume partagé
        root /var/www/html;
        # Fichier d'accueil par défaut quand un répertoire est demandé
        index index.php;

        # Taille maximale autorisée pour le corps d'une requête HTTP (upload)
        client_max_body_size 512M;

        # Pour robots.txt, évite de générer des logs d'accès ou d'absence inutiles
        location = /robots.txt {
            log_not_found off;
            access_log off;
        }

        # Routes standardisées utilisées notamment par les clients de synchronisation
        location ^~ /.well-known {
            # Oriente la découverte CardDAV vers le point d'entrée DAV de Nextcloud
            location = /.well-known/carddav {
                return 301 /remote.php/dav/;
            }

            # Même principe pour la synchronisation des calendriers (CalDAV)
            location = /.well-known/caldav {
                return 301 /remote.php/dav/;
            }

            # Sert la ressource si elle existe, sinon renvoie HTTP 404
            try_files $uri $uri/ =404;
        }

        # Interdit l'accès HTTP à des dossiers internes ou sensibles de Nextcloud
        location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) {
            return 404;
        }

        # Bloque d'autres chemins techniques, notamment les fichiers cachés
        location ~ ^/(?:\.|autotest|occ|issue|indie|db_|console) {
            return 404;
        }

        # Traite les URL vers des scripts PHP (avec ou sans PATH_INFO)
        location ~ \.php(?:$|/) {
            # Réécrit certaines routes PHP vers le contrôleur central index.php
            # Les points d'entrée autorisés dans l'expression restent inchangés
            rewrite ^/(?!index|remote|public|cron|core/ajax/update|status|ocs|updater|ocs-provider) /index.php$request_uri;

            # Sépare le nom du script PHP du complément de chemin (PATH_INFO)
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;

            # Sauvegarde PATH_INFO avant les autres vérifications de chemin
            set $path_info $fastcgi_path_info;

            # N'envoie pas à PHP-FPM un script qui n'existe pas sur le disque
            try_files $fastcgi_script_name =404;

            # Charge les paramètres FastCGI standards fournis par Nginx
            include fastcgi_params;

            # Indique à PHP-FPM le chemin absolu du script à exécuter
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            # Transmet à PHP le complément éventuel du chemin de l'URL
            fastcgi_param PATH_INFO $path_info;
            # Neutralise l'en-tête HTTP_PROXY pour éviter des effets indésirables
            fastcgi_param HTTP_PROXY "";

            # Indique à Nextcloud que le contrôleur frontal est actif
            fastcgi_param front_controller_active true;

            # Délègue l'exécution du PHP au service FastCGI défini plus haut
            fastcgi_pass php-handler;

            # Permet à Nginx de gérer certaines réponses d'erreur FastCGI
            fastcgi_intercept_errors on;
        }

        location / {
            # Laisse index.php traiter la route si le fichier ou le répertoire demandé n'existe pas
             try_files $uri /index.php$request_uri;
        }
    }
}